name: Build firmware

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie

    steps:
      # debian:trixie has no git; without it actions/checkout falls back to a
      # tarball (no .git, fetch-depth ignored) and size_guard cannot run.
      - name: Install git
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          apt update
          apt install make gcc sdcc xxd python-is-python3 libjson-c-dev zlib1g-dev libmnl-dev -y
      - name: Run the host-side unit tests
        run: make -C test
      - name: Check that every machine definition can be compiled
        run: make machine_check
      - name: Make project (4x2/RTL8372)
        run: make CI=1 MACHINE="KP_9000_6XHML_X2"
      - name: Make project (8x1/RTL8373)
        run: make CI=1 MACHINE="KP_9000_9XHML_X_V3_1"
      - name: Make project with the health instrumentation
        run: make clean && make CI=1 MACHINE="KP_9000_6XHML_X2" HEALTH=1
      - name: Build the Linux daemon
        run: make PLATFORM=linux
      - name: Build the Linux daemon as installed (no test hooks) with -Werror, so the code the hooks hide is warning-checked too
        run: make -C platform/linux OUT=output/prod HOOK_FLAGS=-Werror bin
      - name: Test the Linux daemon
        run: make PLATFORM=linux test
      - name: Size guard against merge base
        if: github.event_name == 'pull_request'
        run: tools/size_guard.sh "$(git merge-base HEAD origin/main)"

  # Needs real namespaces (root, no container), so it is a separate job.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libmnl-dev iproute2 busybox ethtool curl python3 openssl
      - name: Build the Linux daemon (the test build, with the hooks the bench uses)
        run: make -C platform/linux testbin
      - name: Run the namespace bench
        run: sudo platform/linux/bench/run.sh
